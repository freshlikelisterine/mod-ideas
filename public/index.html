<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Mod Ideas</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <header>
    <a href="/" id="name" data-nav>Mod Ideas</a>
    <button id="new" class="primary">New idea</button>
  </header>

  <form id="form" hidden>
    <select id="f-cat" required><option value="">Category</option></select>
    <input id="f-title" maxlength="80" placeholder="Your idea in a few words" required autocomplete="off">
    <textarea id="f-body" maxlength="5000" rows="8" placeholder="Describe it. How it works, where it spawns, what it drops..."></textarea>
    <div class="row">
      <input class="f-author" maxlength="16" pattern="[A-Za-z0-9_]{1,16}" placeholder="Minecraft name (optional)">
      <button class="primary">Post</button>
    </div>
    <p class="err"></p>
  </form>

  <section id="list-view">
    <nav id="sort">
      <button data-sort="hot">Hot</button>
      <button data-sort="top">Top</button>
      <button data-sort="new">New</button>
      <input id="q" type="search" placeholder="Search">
    </nav>
    <nav id="cats"></nav>

    <p id="count" class="muted"></p>
    <ol id="wall"></ol>
    <button id="more" hidden>More</button>
  </section>

  <section id="idea-view" hidden></section>
</main>
<div id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
